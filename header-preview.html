<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
    }

    .header {
      height: 112px;
      background: #05070b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 0 32px;
      box-sizing: border-box;
    }

    .brand img {
      height: 38px;
      display: block;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0;
    }

    .theme-icon {
      color: white;
      font-size: 24px;
      line-height: 1;
      margin-right: 18px;
      opacity: 0.95;
    }

    .work-mode-header-slot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-right: 20px;
      padding-right: 2px;
    }

    .work-mode-indicator {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      min-width: 160px;
      padding: 7px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-sizing: border-box;
    }

    .work-mode-indicator__label {
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    .work-mode-indicator__value {
      font-size: 12px;
      line-height: 1.2;
      font-weight: 700;
      color: #8ec5ff;
    }

    .user-toggle {
      display: flex;
      align-items: center;
      padding: 8px 12px 8px 8px;
      box-sizing: border-box;
    }

    .work-mode-user-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      margin-right: 12px;
    }

    .work-mode-user-meta {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .user-name {
      color: #aeb7c4;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .company {
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="file:///Users/denissemendiola/dev/CheckList_Original/checklist/wwwroot/assets/media/logos/checkapp.png" alt="CheckApp" />
    </div>
    <div class="topbar">
      <div class="theme-icon">☀</div>
      <div class="work-mode-header-slot">
        <span class="work-mode-indicator" aria-label="Modo de trabajo actual">
          <span class="work-mode-indicator__label">Modo de trabajo</span>
          <span class="work-mode-indicator__value">Administración</span>
        </span>
      </div>
      <div class="user-toggle">
        <div class="work-mode-user-panel">
          <div class="work-mode-user-meta">
            <span class="user-name">Denisse Martínez Mendiola</span>
            <span class="company">UMBRELLA</span>
          </div>
        </div>
        <div class="avatar">
          <img src="file:///Users/denissemendiola/dev/CheckList_Original/checklist/wwwroot/assets/media/avatars/blank.png" alt="avatar" />
        </div>
      </div>
    </div>
  </header>
</body>
</html>
